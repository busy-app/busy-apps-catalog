short_description: Match an editable RGB swatch to the closest thread in a personal palette using CIE76 colour distance.
description: Match an editable RGB swatch to the closest thread in a personal palette using CIE76 colour distance. Wheel adjusts the active RGB channel in steps of five. Click selects the next channel. Start saves the reference; hold the wheel recalls it. Enter your own threads as code|RRGGBB separated by commas. Factory colours are examples and can be replaced by measured thread colours.
changelog: New screen transitions and high-contrast LED previews.
