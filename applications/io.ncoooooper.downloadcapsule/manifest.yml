short_description: Watch a browser file or Transmission torrent fill a glass capsule with its percentage and time remaining.
description: 'Follow a Chromium download or Transmission torrent on the front display. A local companion can open the app when a transfer starts. Turn the wheel to select a transfer. Completion, pause and an unknown size have distinct readings. Browser mode requires the bundled unpacked extension. Both modes need the local Python companion.


  [Privacy policy](https://github.com/ncoooooper/busybar-download-capsule/blob/main/PRIVACY.md)'
