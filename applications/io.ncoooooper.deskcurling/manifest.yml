short_description: Slide curling stones down the strip, add curl and knock a rival out of the house.
description: 'Play a two-colour curling end across the length of the bar. Aim the guide line, hold Start to build power and release to slide a stone. Stones carry momentum into each other, so an opponent’s well-placed shot can become the target of your next throw.


  [Setup and controls](https://github.com/ncoooooper/busybar-desk-curling/blob/main/README.md) · [Privacy](https://github.com/ncoooooper/busybar-desk-curling/blob/main/PRIVACY.md)'
