category: games

short_description: A slingshot game. Sling a glowing ember at towers of ice and stone and knock out every gem with five embers.

description: "@CATALOG.md"

changelog: |
  First release: a slingshot game with more than 6,000 different fields that get harder slowly (free towers, walls, stairs, pillars, gates, stone caps on ice), each checked to be clearable in several ways; five embers a round; ice that shatters, stone that cracks first, pieces that fall and crush what is under them; a flat shot and a lob; a guide to the controls, five pages you turn yourself, the first time the app is opened; a little extra for a one-shot clear and for a collapse; the best score and the furthest round kept on the bar.

