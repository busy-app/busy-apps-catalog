description: 'Drive a trolley, let the suspended load settle and release four containers onto a marked dock. Each container becomes the target for the next one. Watch the load itself when the trolley slows down. It can still be swinging when the carriage looks centred.


  [Setup and controls](https://github.com/ncoooooper/busybar-crane-shift/blob/main/README.md) · [Privacy](https://github.com/ncoooooper/busybar-crane-shift/blob/main/PRIVACY.md)'
