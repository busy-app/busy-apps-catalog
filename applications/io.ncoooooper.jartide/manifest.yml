category: utilities
short_description: See a shelter jar’s balance and its net change over one or five minutes.
description: 'Choose one of two public shelter jars and start the Python companion on your computer. Turn the wheel to check the balance, goal and progress, or see how much the jar gained or lost over one or five minutes. The rear display gives the currency and the actual time between readings. The bar refreshes about every 65 seconds and shows Waiting until it has enough history. Both public presets work without a bank account or token.


  [Companion setup and controls](https://github.com/ncoooooper/busybar-jar-tide#public-shelter-widgets) · [Privacy policy](https://github.com/ncoooooper/busybar-jar-tide/blob/main/PRIVACY.md)'
changelog: Adds rolling one-minute and five-minute balance changes with the measured time span on the rear display.
