short_description: Coordinate three dishes for one serving time and see which one runs late.
description: 'Work backward from dinner time. Set one serving countdown and the cooking time for three dishes. The front calls out the next kitchen action. Once a dish starts, the rear compares its expected finish with the original serving target.


