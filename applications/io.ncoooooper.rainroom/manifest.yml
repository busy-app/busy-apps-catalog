short_description: Watch drops strike a puddle. Turn the wheel for drizzle, steady rain or a downpour.
description: 'Set a small rainstorm on the edge of your desk. Drops fall through a blue night sky and strike the water at two distances. A foreground drop throws up a splash and opens a ring across the puddle. Choose a light drizzle to follow individual impacts, or fill the scene with a downpour. The scene is silent and runs offline.


  [Setup and controls](https://github.com/ncoooooper/busybar-rain-room/blob/main/README.md) · [Privacy](https://github.com/ncoooooper/busybar-rain-room/blob/main/PRIVACY.md)'
