short_description: Count rows, catch the next shaping instruction and undo a row without losing your place.
description: 'Keep your working row and the next shaping instruction in view while you knit. Ordinary rows alternate between a knit arrow and a purl arrow. On a shaping row the instruction takes their place, so you can see when to decrease, increase, cable or change colour.


  [Setup and controls](https://github.com/ncoooooper/busybar-stitch-ferry/blob/main/README.md) · [Privacy](https://github.com/ncoooooper/busybar-stitch-ferry/blob/main/PRIVACY.md)'
