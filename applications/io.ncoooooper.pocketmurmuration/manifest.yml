short_description: Steer the wind through a flock of starlings and scatter the birds with a press.
description: 'Twenty-eight starlings share one strip of sky. Each bird steers around close neighbours, matches nearby flight and responds to the wind. You can watch a loose group pull together, fly out one side of the display and return on the other.


  [Setup and controls](https://github.com/ncoooooper/busybar-pocket-murmuration/blob/main/README.md) · [Privacy](https://github.com/ncoooooper/busybar-pocket-murmuration/blob/main/PRIVACY.md)'
