category: art
short_description: A pair of blinking eyes follows a firefly, trades a wink and does a double take on your desk.
description: 'Two eyes keep watch from the edge of your desk. They glance around and blink together until something catches their attention. A tiny amber firefly flies in and lands between them. Both pupils turn inward to look at it, then follow it off the edge. Leave the bar running and the eyes will also do a double take and trade winks.


  [Setup and controls](https://github.com/ncoooooper/busybar-side-eye/blob/main/README.md) · [Privacy](https://github.com/ncoooooper/busybar-side-eye/blob/main/PRIVACY.md)'
