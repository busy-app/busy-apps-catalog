category: games

short_description: Cut bread, fish and more into even pieces before the time runs out. Turn the wheel to aim, press to cut.

description: "@CATALOG.md"

changelog: |
  First release: a game of cutting food into even pieces. Ten foods drawn with their own cut faces, one to six cuts a round against a time line that shrinks to the middle, a score for how even the pieces are with a verdict from PERFECT to RUINED, a pass mark that rises with the rounds, a controls card that waits for you, pause, the five best games kept on the bar, and two settings (controls card at start, start over).

