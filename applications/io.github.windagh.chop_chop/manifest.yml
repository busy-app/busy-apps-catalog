category: games

short_description: Cut bread, fish and more into even pieces before the time runs out. Turn the knob to aim, press Start or OK to cut.

description: "@CATALOG.md"

changelog: |
  First release: a game of cutting food into even pieces. The app opens on its main screen, where Start plays and pressing the knob (OK) opens a short guide to the controls, which also opens by itself on first use. Ten foods drawn with their own cut faces, one to six cuts a round against a time line that shrinks to the middle, a score for how even the pieces are with a verdict from PERFECT to RUINED, a pass mark that rises with the rounds, pause, the five best games kept on the bar, and a Start over switch in the settings.

