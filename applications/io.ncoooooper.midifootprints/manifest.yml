category: music
short_description: See played and sustained MIDI notes leave different trails and freeze a chord.
description: 'Watch the difference between what your fingers hold and what the sustain pedal keeps ringing. Each pitch has a column. White columns rise under your fingers, mint columns carry a released note under pedal, and blue trails fade after pedal-up. The rear screen names the notes and counts keys and sustained notes separately.


  The companion runs on a computer on your trusted network.


  [Setup and controls](https://github.com/ncoooooper/busybar-midi-footprints/blob/main/README.md) · [Privacy](https://github.com/ncoooooper/busybar-midi-footprints/blob/main/PRIVACY.md)'
