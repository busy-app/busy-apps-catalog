short_description: Memorise five exhibits, watch the lights go out and identify the stolen or swapped object.
description: 'Memorise five objects in a miniature gallery. When the lights come back, one pedestal is empty or holds a different object. Choose the changed pedestal to catch the thief. Fourteen pieces rotate through the gallery, so the right answer moves from round to round.


