category: utilities
short_description: Remember loaned items, sort them by due date and mark a real return from the bar.
description: Remember loaned items, sort them by due date and mark a real return from the bar. In settings enter up to eight loans as Item|YYYY-MM-DD separated by semicolons, using local due dates. The earliest outstanding item appears first. Wheel browses. Click marks the displayed loan returned. Start toggles between outstanding and returned loans; click in the returned view restores a mistakenly closed item.
changelog: New screen transitions and high-contrast LED previews.
