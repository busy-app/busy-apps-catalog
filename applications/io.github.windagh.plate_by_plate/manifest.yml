short_description: A conveyor-belt sushi bar to watch and eat from. Take a plate, eat it in three bites, return the plates for keepsakes.

description: "@CATALOG.md"

changelog: |
  First release: a conveyor belt with 23 dishes under glass domes (three of them rare, on gold plates), a plate brought in front of you and eaten in three bites, your table with the empty plates, a slot that takes them back and counts them, a capsule every fifth plate with ten keepsakes to win, a menu to complete, quiet nights, a guide of five pages to the controls on first use, and settings for the belt's speed, quiet nights and starting over.

