short_description: A red and blue desk light bar with alternating lenses, a sweep and a one-button blackout.
description: 'Turn the BUSY Bar into a miniature police light bar for your desk. Three red lenses sit on the left and three blue lenses on the right. Alternate lights one bank at a time. Sweep moves a highlight along all six lenses and sends it back the other way. Both effects are silent.


  [Setup and controls](https://github.com/ncoooooper/busybar-patrol-lights/blob/main/README.md) · [Privacy](https://github.com/ncoooooper/busybar-patrol-lights/blob/main/PRIVACY.md)'
