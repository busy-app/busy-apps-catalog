short_description: Browse 254 flags offline or rotate a shortlist on your desk.
description: Turn the wheel to browse country and territory flags. The front shows the flag in its original proportions. The back shows its name and code. Set Ukraine as the startup flag, save Poland alongside it, then press Start to rotate between them at your chosen interval. The artwork is bundled with the app.
changelog: New screen transitions and high-contrast LED previews.
