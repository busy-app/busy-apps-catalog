short_description: Follow a GitHub Actions workflow through its active step, estimated finish and recent success rate.
description: 'Follow one GitHub Actions workflow and branch. During a build the bar shows the active step, elapsed time and an estimate based on earlier successful runs. Between builds it keeps the latest outcome on screen.


  The companion runs on a computer on your trusted network.


  [Setup and controls](https://github.com/ncoooooper/busybar-pipeline-rail/blob/main/README.md) · [Privacy](https://github.com/ncoooooper/busybar-pipeline-rail/blob/main/PRIVACY.md)'
