category: music
short_description: See elapsed and remaining time for the film or song playing in desktop VLC.
description: 'Enable VLC’s web interface and give the local Python companion its HTTP password. Open a film or song. The bar follows VLC as you play, pause or seek. Turn the wheel for time remaining, or pin that page with Start. A stream with unknown duration shows Live. Stopping playback clears the old playhead.


  [Privacy policy](https://github.com/ncoooooper/busybar-playback-dial/blob/main/PRIVACY.md)'
changelog: New screen transitions and high-contrast LED previews.
