short_description: Choose a mood, a pixel face and an invitation for people near your desk.
description: 'Tell people at your desk how you feel and whether now is a good time to talk. The front of the bar pairs a mood with a pixel face and a short request. Turn the wheel to try a different mood on the rear screen. People across the desk see your choice only after you click.


  [Setup and controls](https://github.com/ncoooooper/busybar-mood-signal/blob/main/README.md) · [Privacy](https://github.com/ncoooooper/busybar-mood-signal/blob/main/PRIVACY.md)'
