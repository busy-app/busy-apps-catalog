short_description: See the current meeting and time left. Turn the wheel to choose between overlapping events.
description: 'Read timed events from an Outlook, Google, Apple or other iCalendar subscription through a local companion. The front display pairs an event name with a live countdown. Turn the wheel to follow an overlapping event until it ends. A clear calendar and an unavailable source have distinct displays.


  [Privacy policy](https://github.com/ncoooooper/busybar-calendar-dial/blob/main/PRIVACY.md)'
