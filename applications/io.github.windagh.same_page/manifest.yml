category: social

short_description: A party game for a group. The clue-giver peeks at a hidden spot on a scale and gives a clue, the others guess.

description: "@CATALOG.md"

changelog: |
  First release: a guessing game for a group round the desk. A band of light hides a target behind a shutter; the clue-giver peeks with Start and gives one clue, the others turn the knob to move a marker, and Start then opens the shutter for the reveal, which scores 4, 3, 2 or 0 points with a verdict staged in its own way. OK deals a new round at any time. The app opens on its main screen, where the knob chooses WORDS (159 pairs of opposites in three lists) or BLANK (a scale of your own), Start plays, pressing the knob (OK) opens the guide and Back leaves. Cues on screen for every step, eight sets of colours, three target widths, a running total, a prompt on the back screen that never shows the target, a five-page guide on first use, and a Start over setting.

