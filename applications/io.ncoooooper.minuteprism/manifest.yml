short_description: Turn the wheel to choose one of four kaleidoscope patterns. It keeps turning until you choose another.
description: 'Choose a kaleidoscope for your desk and leave it turning. The centre pane rotates while the panes on either side mirror its motion. The wheel selects the design. It stays on the display until you turn the wheel again, and the bar remembers it when you close the app.


  [Setup and controls](https://github.com/ncoooooper/busybar-minute-prism/blob/main/README.md) · [Privacy](https://github.com/ncoooooper/busybar-minute-prism/blob/main/PRIVACY.md)'
changelog: Four continuously rotating patterns. Turn the wheel to change designs. The last selection is restored on launch.
