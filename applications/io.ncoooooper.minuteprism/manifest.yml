short_description: A full-width kaleidoscope that changes pattern with each wall-clock minute.
description: 'Leave Minute Prism running on a shelf or at the edge of your desk. Each change of minute opens a new mirrored pattern across the front of the BUSY Bar. You can tell that a minute has passed without putting a clock or a label over the artwork.


  [Setup and controls](https://github.com/ncoooooper/busybar-minute-prism/blob/main/README.md) · [Privacy](https://github.com/ncoooooper/busybar-minute-prism/blob/main/PRIVACY.md)'
