category: music

short_description: What is playing, as a record player with karaoke lyrics. Works with a small Mac app or your own Spotify keys.

description: "@CATALOG.md"

changelog: |
  First release: what you are listening to as a record player. Twelve records, one per album, with an arm that comes down when the music starts and lifts when it pauses; synced lyrics from lrclib.net in two rows that take turns, with the lyrics of the last 20 songs kept on the bar; three views (lyrics, song info, a ribbon of light); Start plays and pauses, the knob sets the volume; a film projector for videos. The app opens on its main screen: Start enters, pressing the knob (OK) opens the guide. What is playing comes from Vinyl for Mac (in this folder, with SETUP.md), over Wi-Fi after pairing once by USB, or from your own Spotify keys.

