short_description: "A reel that decides for you: eat, drink, wear, move, watch, go, yes or no, or a list of your own."

description: "@CATALOG.md"

changelog: |
  First release: eight lists on one reel (eat, drink, wear, move, watch, go, yes or no, and a list of your own from the settings), a spin that slows in three clicks and lands on the answer in large letters, a shirt in the chosen colour for Wear, no answer twice in a row, a guide to the controls the first time you open it, and settings for your own list and starting over.

