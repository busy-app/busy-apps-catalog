category: utilities

short_description: "A reel that decides for you what to eat, drink, wear or watch, where to go, yes or no, or picks from your own list."

description: "@CATALOG.md"

changelog: |
  First release: eight lists on one reel (eat, drink, wear, move, watch, go, yes or no, and a list of your own from the settings), a spin that slows in three clicks and lands on the answer in large letters, a shirt in the chosen colour for Wear, no answer twice in a row, a main screen where Start spins and a press of the knob (OK) opens the guide to the controls, and settings for your own list and starting over.

