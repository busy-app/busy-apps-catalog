category: art

short_description: A glass tank of simulated water. Push it, tilt it, watch the waves, and float a rubber duck on it.

description: "@CATALOG.md"

changelog: |
  First release: a glass tank of simulated water. Start pushes the water in the middle (a crown, drops, waves that come back from the glass), turning the knob tilts the tank up to breaking fronts with foam and spray. Eight waters, one of them a slow rainbow. Seven things that float and ride the waves (duck, sailing boat, paper boat, message in a bottle, beach ball, ice cube, buoy with a light), or none. The water and what floats are chosen on the bar itself, in two steps with OK and the knob. A guide of five living pages at the start, a calm mode that stirs the water now and then, and round glass corners.

