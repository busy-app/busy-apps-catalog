category: games

short_description: "A three-reel slot machine with play coins only. Spin, set your bet and hit the jackpot. No real money anywhere."

description: "@CATALOG.md"

changelog: |
  First release: a three-reel slot machine with play coins only, no real money anywhere. Six symbols on reels that blur and stop one after another, bets of 1 to 25 coins, wins that light up the reels and count into the balance, a JACKPOT sign for three sevens or three diamonds, info pages with the pay table, a new game with 100 coins when the coins are gone, a main screen where Start enters the game and a press of the knob (OK) opens the guide to the controls, and settings for quick spins and starting over.

