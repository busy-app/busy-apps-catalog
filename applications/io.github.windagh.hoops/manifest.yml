category: info-feeds

short_description: NBA game night as a live score strip with timeouts, runs, fouls, big-play signs and tip-off countdowns.

description: "@README.md"

changelog: |
  First release: live NBA score strips with the quarter's time along the bottom, timeouts, runs and team fouls; signs for threes (with the shooter's number and name), runs, lead changes, overtime and the final; halftime and tip-off countdowns; a carousel of the day's finished and coming games; jerseys or tall letters with OK; a champions' banner and an offseason countdown when the season is over.

