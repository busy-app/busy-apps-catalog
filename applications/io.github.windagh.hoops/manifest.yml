category: info-feeds

short_description: NBA game night as a live score strip with timeouts, runs, fouls, big-play signs and tip-off countdowns.

description: "@CATALOG.md"

changelog: |
  Fix: with the teams shown as their three letters alone (OK), the tall letters stand one row higher - two dark rows above them and two between them and the line along the bottom, in every state of a game. They sat one row too low, almost on the countdown line before a game. New: the game clock now ticks between updates, a second a second, down to the value last received, and the game on screen is checked every 5 seconds instead of 8. The app opens with a short author's mark.

