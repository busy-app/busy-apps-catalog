short_description: Talk a ferry through fog. The lookout sees the channel and the captain steers by compass.
description: 'Guide a ferry through three reef charts with a second player. The lookout sees the boat, shoals and harbour light on the front. The captain faces the rear compass and steers from the lookout’s directions. You can practise either role by turning the bar.


  [Setup and controls](https://github.com/ncoooooper/busybar-fog-ferry/blob/main/README.md) · [Privacy](https://github.com/ncoooooper/busybar-fog-ferry/blob/main/PRIVACY.md)'
