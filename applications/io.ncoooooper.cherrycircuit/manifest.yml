short_description: Spin three reels and collect pairs and triples in a free-play desk game.
description: Press Start for a spin. Each reel stops in turn on a cherry, seven, bell, orange or BAR tile. A matching pair lights two green marks. A triple draws a gold line across the reels. A miss ends the round and you can spin again. The win counter survives a restart. Everything runs on the bar.
changelog: Separate reel-stop animations for a miss, a pair and a triple.
