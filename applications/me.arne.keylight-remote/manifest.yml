category: smart-home

short_description: Control your Elgato Key Light from your BUSY Bar.

description: |
  Control your Elgato Key Light from your BUSY Bar: turn it on and off, set
  brightness and color temperature with the wheel, and switch between four
  presets. The app runs on the BUSY Bar itself and talks to the light over your
  network.

  Changing the light currently needs a small relay running on a computer on your
  network due to the Key Lights only supporting HTTP/1.1 requests.

  ## Setup

  1. Install the app
  2. Start the relay on a computer in your network
  3. Enter the IP address of the relay in your BUSY Bar's web interface

changelog: |
  First release: You can turn a light on or off and control brightness,
  temperature. There's four presets available.

