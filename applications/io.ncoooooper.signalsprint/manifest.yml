short_description: Test your button reaction on green and practise ignoring the orange signal.
description: Press the wheel to start a round. Wait while the display is dark. Orange means hold still and green means press. A correct press shows the reaction time in milliseconds. An early press or a press on orange ends the round. Your best successful time stays on the bar between sessions.
changelog: New screen transitions and high-contrast LED previews.
