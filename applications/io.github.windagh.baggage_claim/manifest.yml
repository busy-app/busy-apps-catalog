short_description: "An airport baggage belt for your desk, seen from above: endless luggage, and now and then something that is not."

description: "@CATALOG.md"

changelog: |
  First release: an airport baggage hall seen from above. The app opens on its main screen, where Start enters and pressing the knob (OK) opens the guide. A roller shutter, lamps that strike one by one, four belts to move between, 21 kinds of luggage in many colours and 21 surprises with a small life of their own (a sleeping traveller, a cat, a robot vacuum going the wrong way, seasonal ones), rubber flaps that every thing pushes through, jolts, luggage tags with a few dry words, four belt speeds, and light that follows the bar's clock.

