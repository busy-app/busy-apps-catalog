short_description: Explore a GPX elevation profile and find the steepest 500 metres of each climb.
description: 'Open a recorded route to see where the hardest half kilometre begins. Climb Ribbon reads the trackpoints and elevations in a GPX file. It gives you a distance along the route, so you can compare two hills even when they start at different elevations.


  The companion runs on a computer on your trusted network.


  [Setup and controls](https://github.com/ncoooooper/busybar-climb-ribbon/blob/main/README.md) · [Privacy](https://github.com/ncoooooper/busybar-climb-ribbon/blob/main/PRIVACY.md)'
