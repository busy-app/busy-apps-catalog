category: info-feeds

short_description: Stock and crypto prices one at a time, with the day's line and today, 5-day and 1-month views.

description: "@CATALOG.md"

changelog: |
  Fixes. Before a market opens - at night, on a weekend, on a holiday - the box keeps the line and the change of the last session; it stood empty once the quote source had announced the next trading day. In the hours before the opening the app no longer shows a pre-market session that has not traded yet. The two lines of the notice for a symbol that is not found (and for no data) now stand clear of the box's rim. New: the app opens with a short author's mark. New: a further fallback for quotes, Tencent's public quote service (qt.gtimg.cn), asked when neither Yahoo Finance nor CNBC answers - for places where those cannot be reached; it covers shares and funds listed in the United States, Hong Kong, Shanghai and Shenzhen and four indexes, with the price and the day's change of the regular session.

