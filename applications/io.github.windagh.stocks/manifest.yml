description: "@CATALOG.md"

changelog: |
  Fixes. Before a market opens - at night, on a weekend, on a holiday - the box keeps the line and the change of the last session; it stood empty once the quote source had announced the next trading day. In the hours before the opening the app no longer shows a pre-market session that has not traded yet. The two lines of the notice for a symbol that is not found (and for no data) now stand clear of the box's rim. New: the app opens with a short author's mark.

