short_description: Fit a track list onto two tape sides and move songs without cutting a track short.
description: 'Lay out a track list before recording a cassette. The front shows the time left on the selected track’s side. Turn the wheel to inspect the songs, move them one at a time, or let the bar find a split using whole tracks and their exact durations.


  [Setup and controls](https://github.com/ncoooooper/busybar-mixtape-fit/blob/main/README.md) · [Privacy](https://github.com/ncoooooper/busybar-mixtape-fit/blob/main/PRIVACY.md)'
