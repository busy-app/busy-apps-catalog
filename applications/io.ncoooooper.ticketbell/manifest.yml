category: utilities
short_description: Track ticket availability, price thresholds, observed lows and remaining reward stock.
description: 'Configure the local companion with a sale page or a watchlist. It can read an enabled purchase control, a supported price feed, a numeric stock field or a price-alert email. Set a strict price limit and keep the history file to compare future observations with your lowest recorded price. PS Deals uses your own notification email. A reward quantity needs a feed that publishes the number remaining.


  [Privacy policy](https://github.com/ncoooooper/busybar-ticket-bell/blob/main/PRIVACY.md)'
changelog: Read the discounted price for a selected PS Deals edition and region in single-game and multi-game alerts.
