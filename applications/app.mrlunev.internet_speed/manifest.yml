category: dev-monitoring

short_description: Your computer's live internet traffic, down and up, on a speedometer. Needs a small companion on a Mac or Windows PC.

description: |-
  Live internet traffic of your computer on a speedometer: download on the needle, download and upload in numbers. Not a speed test.

  **Setup.** Plug the bar in by USB and run on the computer:

  - Mac, Terminal: curl -fsSL https://raw.githubusercontent.com/mrlunev/busybar-internet-speed/main/install.sh | bash
  - Windows, PowerShell: irm https://raw.githubusercontent.com/mrlunev/busybar-internet-speed/main/install.ps1 | iex

  After that the bar works over the cable or the same Wi-Fi.

  **States:** SET UP, NO PC, NO NET, UPDATE. The back screen shows how to fix each.

  **Settings:** dial scale, Auto or fixed from 50 Mbit/s to 10 Gbit/s.

  **Privacy:** the companion sends nothing to the internet and answers only devices on the local network.

changelog: First release.

