short_description: Watch a little act play a rhythm, then play it back with Start. Five acts, eight levels, three hearts.

description: "@CATALOG.md"

changelog: |
  First release: a rhythm game of watch, count, play it back. Five acts made for this app (a cat at a drum, a bear at an anvil, a frog and a firefly, a woodpecker, a popcorn pan), forty phrases in eight levels from 90 to 130 beats a minute, a prompt that always says whose turn it is, the phrase written on a strip with a lamp that walks it, a verdict that shows every hit early or late, three hearts, and a best score kept on the bar. The app opens on its main screen: Start plays, a press of the knob (OK) opens the guide.

