category: info-feeds

short_description: NFL game day as a live score strip with the field, timeouts, big-play signs and kick-off countdowns.

description: "@README.md"

changelog: |
  First release: live NFL score strips with the field, the ball and the line to gain, timeouts, red zone, halftime and kick-off countdowns; broadcast-style signs for touchdowns, field goals, turnovers and sacks with the player's number and name; a carousel of the week's finished and coming games; a champions' banner and an offseason countdown after the season; a countdown line, a KICKOFF card and tall letters or team marks with OK.

