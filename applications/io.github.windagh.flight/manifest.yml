category: productivity

short_description: A focus timer as a flight. Pick an airport and a time, get a boarding pass, and watch the real sky go by.

description: "@CATALOG.md"

changelog: |
  First release: a focus session as a flight between 3,244 real airports. A hall with a logbook, check-in on split-flap tiles (departure, flight time from 15 minutes to 16 hours, destinations that far away), an airport search by its three letters, a printed boarding pass, a take-off that ends looking out of a cabin window, the sun, the moon in its phase, stars and clouds from the real weather where the aircraft is, a flight board, pause, a seat-belt sign before landing, a landing with the local time, and a logbook of the last 60 flights.

