short_description: See the keyboard input source selected on your Mac without recording what you type.
description: 'Keep the active macOS keyboard layout visible while you type. The host reads the input-source identifier through Text Input Sources. The bar shows a short language code and the full layout name.


  The companion runs on a computer on your trusted network.


  [Setup and controls](https://github.com/ncoooooper/busybar-layout-lamp/blob/main/README.md) · [Privacy](https://github.com/ncoooooper/busybar-layout-lamp/blob/main/PRIVACY.md)'
