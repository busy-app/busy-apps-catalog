short_description: See the four Galilean moons appear on either side of Jupiter and turn through the night.
description: 'Which side of Jupiter should you look on for Io? Jupiter Four places the four Galilean moons relative to Jupiter as seen from Earth. Step through the hours to follow a moon past its neighbours. The predicted positions come from the Jet Propulsion Laboratory''s Horizons service. [JPL Horizons API](https://ssd-api.jpl.nasa.gov/doc/horizons.html)


  The companion runs on a computer on your trusted network.


