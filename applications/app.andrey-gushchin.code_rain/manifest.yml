short_description: Matrix-style digital rain with fading green trails and wheel-controlled speed.
description: |-
  Code Rain brings Matrix-style digital rain to the BUSY Bar’s 72×16 front display. Fourteen streams of mirrored katakana fall at staggered speeds, with bright green heads and fading trails.

  Open **Code Rain** from the Apps menu to start at 1× speed. Turn the wheel clockwise to speed up or counterclockwise to slow down, from 0.5× to 2× in 0.25× steps. A short press of the wheel advances one step and wraps from 2× to 0.5×. Press **Back** to exit. Code Rain runs offline.
changelog: First release of Code Rain, with wheel controls for rain speed.
