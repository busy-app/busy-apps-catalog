category: games

short_description: Endless runner. Jump over mushrooms and rocks with the Start button.

description: |
  A little frog runs along the ground and you jump over mushrooms and rocks with the **Start** button. The run speeds up as you go.

  - **Start:** jump. Also starts a new run.
  - **OK:** pause and resume.
  - **Back:** pause during a run, exit otherwise.

  Tall mushrooms appear from score 80, mushroom and rock pairs from 120, and bees from 150. Bees fly at jump height, so stay on the ground while one passes. If a notification covers the screen during a run, the game pauses. Your best score is saved on the bar.

changelog: |
