name: AI review
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to review
        type: string
        required: true
permissions: {}
concurrency:
  group: catalog-ai-review-${{ inputs.pr_number }}
  cancel-in-progress: false
jobs:
  authorize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require write access
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.triggering_actor }}
          PR_INPUT: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          [[ "$PR_INPUT" =~ ^[1-9][0-9]*$ ]]
          PERMISSION=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq .permission)
          case "$PERMISSION" in
            admin|maintain|write) ;;
            *) echo "The AI review can only be started by people with write access"; exit 1 ;;
          esac
  discover:
    needs: authorize
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      head_sha: ${{ steps.discover.outputs.head_sha }}
      run_id: ${{ steps.discover.outputs.run_id }}
      build_artifact: ${{ steps.discover.outputs.build_artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: python -m pip install -r tools/requirements.txt
      - name: Find the PR build and manifest
        id: discover
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: python -m tools.review_cli discover --pr "$PR_NUMBER" --output approved
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: review-manifest-${{ github.run_id }}
          path: approved/manifest.yml
          retention-days: 1
          if-no-files-found: error
  review:
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: python -m pip install -r tools/requirements.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: review-manifest-${{ github.run_id }}
          path: approved
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.discover.outputs.build_artifact }}
          path: build
          run-id: ${{ needs.discover.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: results-${{ needs.discover.outputs.head_sha }}
          path: checked
          run-id: ${{ needs.discover.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Ask the backend and update the comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CATALOG_API: ${{ vars.CATALOG_API }}
          CATALOG_CI_TOKEN: ${{ secrets.CATALOG_CI_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ needs.discover.outputs.head_sha }}
          REQUESTED_BY: ${{ github.triggering_actor }}
        run: >-
          python -m tools.review_cli run --pr "$PR_NUMBER" --head "$HEAD_SHA"
          --requested-by "$REQUESTED_BY" --build-dir build
          --results checked/results.json --manifest approved/manifest.yml
