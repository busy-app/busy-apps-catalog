name: Catalog E2E
on:
  workflow_dispatch:
    inputs:
      env:
        description: Environment to verify
        type: choice
        options: [dev, stage]
        default: dev
        required: true
permissions: {}
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: ${{ inputs.env }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: python -m pip install -r tools/requirements.txt -r e2e/requirements.txt
      - name: Verify catalog
        env:
          E2E_CATALOG_REPO: ${{ github.repository }}
          E2E_FIXTURES_REPO: busy-app/busy-apps-catalog-fixtures
          E2E_API: ${{ vars.CATALOG_API }}/api/catalog/v1
          E2E_AUTHOR_TOKEN: ${{ secrets.E2E_AUTHOR_TOKEN }}
          E2E_MODERATOR_TOKEN: ${{ secrets.E2E_MODERATOR_TOKEN }}
          E2E_ADMIN_TOKEN: ${{ secrets.E2E_ADMIN_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          TARGET_ENV: ${{ inputs.env }}
        run: make e2e ENV="$TARGET_ENV"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: e2e-report
          path: e2e-report.md
          if-no-files-found: error
